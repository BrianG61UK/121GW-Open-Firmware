# Bootloader (branch bootloader): build the firmware objects the bootloader links (fast build, GNU binutils 2.46.0), then
# the starter, the bootloader and the first-install file; on a tag bl-vA.B.C publish bootloader-<tag>.zip.
name: Bootloader

on:
  push:
    branches: ['bootloader']
    tags: ['bl-v*']
    # a push that changes only text builds and tests nothing new: no run (owner 2026-11-08); GitHub does not apply path
    # filters to tags, so a release tag always builds
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootloader-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build the starter, the bootloader and the install file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Firmware (its SD driver, FatFs, GPIO, clock and font objects are linked into the bootloader)
        uses: ./.github/actions/build-firmware
        with:
          target: none
      - name: Bootloader
        run: |
          set -euo pipefail
          make -C bootloader PYTHON=python3
          mkdir -p bdist
          cp bootloader/build/starter.bin bootloader/build/install.bin bdist/
          cp bootloader/build/bootloader.bin bdist/blimage.bin    # not bootloader.bin: that name is EEVblog's (check_no_originals)
          cp bootloader/README.md bdist/
      - name: Nothing from an original image may be published
        run: python3 -I .github/scripts/check_no_originals.py bdist
      - uses: actions/upload-artifact@v7
        with:
          name: bootloader-dist
          path: bdist
          if-no-files-found: error

  tests:
    # The bootloader's emulator tests (starter decisions and power cuts, the scenarios B1..B9): one job per script.
    # Not run here: test_first_install.py (needs EEVblog's bootloader images) and test_exfat.py (reads the card with a
    # host build of ChaN's FatFs R0.16, ../fatfs16/harness_x/ref); neither is in this repository.  Not on release
    # tags, as the emulator workflow's tests.
    name: Bootloader test ${{ matrix.script }}
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EMU_TEST_WALL_S: '2280'
    strategy:
      fail-fast: false
      matrix:
        # test_bootloader.py in four groups of its scenarios in parallel (all twelve in one job took 18 minutes, owner
        # 2026-11-09: "you wasting resources and my time"; groups by the times of 2026-11-09: B3 B10 5.6 min, B4 B1 B2
        # 4.5, B11 B5 2.2, B12 B9 B6 B7 B8 7.5 before B7 B8 moved); B10 stays with B3, whose time and packets it compares
        script: [test_starter.py, 'test_bootloader.py B3 B10', 'test_bootloader.py B4 B1 B2', 'test_bootloader.py B11 B5 B7 B8',
                 'test_bootloader.py B12 B9 B6']
    steps:
      - uses: actions/checkout@v7
      - name: Production build (firmware/build/EEVBlog.bin and 121gw.map; the objects the bootloader links)
        uses: ./.github/actions/build-firmware
        with:
          target: none
      - name: Emulator data (v2.05 table data of the build, synthetic EEPROM)
        run: python -I emulator/tools/prepare_data.py --dist dist
      - name: Bootloader build
        run: make -C bootloader PYTHON=python3
      - name: Run ${{ matrix.script }}
        run: python -I bootloader/tests/${{ matrix.script }}

  release:
    name: Publish bootloader-${{ github.ref_name }}.zip
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'bl-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the bootloader version (bootloader/src/bl.inc BL_VERSION)
        run: |
          set -euo pipefail
          v=$(sed -n 's/^ *\.equ BL_VERSION, *0x\([0-9A-Fa-f]*\).*/\1/p' bootloader/src/bl.inc)
          want=$(printf 'bl-v%d.%d.%d' $((16#${v:2:2})) $((16#${v:4:2})) $((16#${v:6:2})))
          test "$TAG" = "$want" || { echo "tag $TAG, bootloader version $want"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: bootloader-dist
          path: bdist
      - name: Assemble bootloader-<tag>.zip
        run: |
          set -euo pipefail
          cp LICENSE bdist/
          (cd bdist && sha256sum install.bin blimage.bin starter.bin README.md LICENSE > SHA256SUMS)
          (cd bdist && zip -r -X "../bootloader-$TAG.zip" install.bin blimage.bin starter.bin README.md LICENSE SHA256SUMS)
          unzip -l "bootloader-$TAG.zip"
          python3 -I .github/scripts/check_no_originals.py "bootloader-$TAG.zip"
          python3 -I .github/scripts/sha256sum.py "bootloader-$TAG.zip" > "bootloader-$TAG.zip.sha256"
      - name: Create the release and attach the files
        run: |
          set -euo pipefail
          python3 -I .github/scripts/release_notes.py .github/release-notes-bootloader.md bootloader/CHANGELOG.md "$TAG" "https://github.com/${{ github.repository }}/blob/bootloader/bootloader/CHANGELOG.md" "$RUNNER_TEMP/notes.md"   # only this version (issue 29)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag \
            --title "121GW two-part bootloader $TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          gh release upload "$TAG" "bootloader-$TAG.zip" "bootloader-$TAG.zip.sha256" --clobber

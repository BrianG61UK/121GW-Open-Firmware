# Companion: PyInstaller one-folder program with everything it needs (Python, bleak with the system's backend, pywebview,
# the page), packaged as macOS .dmg (Apple Silicon), Windows installer .exe (Inno Setup), Linux AppImage and .deb (x86_64).
# The unit tests (tests/, no meter and no Bluetooth needed) run in every job; the packaging only on a release tag or a
# run started by hand.  Every package is
# started (or installed and started) and must answer on its local server, page and protections included
# (.github/scripts/smoke.py), before it is uploaded.  On a tag companion-vA.B.C the packages are attached to that release,
# created without the "latest" mark so the fast firmware release stays the default download of the repository.
name: Companion

on:
  push:
    branches: ['companion']
    tags: ['companion-v*']
    # a push that changes only text or the README pictures builds nothing new: no run (owner 2026-11-08); GitHub does not
    # apply path filters to tags, so a release tag always builds
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: ['companion']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # tag companion-v1.2.3 -> 1.2.3 (step "Version"); any other ref -> dev
  REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
  # packages are built only for a release tag (or a run started by hand): a branch push runs the unit tests on the three
  # systems and nothing else, its packages were never used (owner 2026-11-09: "you wasting resources and my time")
  PACKAGE: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
  PIP_PKGS: bleak==3.0.2 pywebview==6.1 pyinstaller==6.22.3 pillow certifi==2026.10.23

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Developer ID signing and notarization only when the repository has the signing secrets (they are not given to
      # pull requests from forks): MACOS_CERT_P12 (the .p12 of the Developer ID Application certificate and its key,
      # base64), MACOS_CERT_PASSWORD, NOTARY_KEY_P8 (the App Store Connect API key .p8, base64), NOTARY_KEY_ID,
      # NOTARY_ISSUER.  Without them the build stays unsigned as before.
      SIGN: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Version
        run: echo "VER=${REF_TAG#companion-v}" >> "$GITHUB_ENV"
      - name: Build tools and libraries
        run: python -m pip install $PIP_PKGS
      - name: Page test browser (cache)
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.64.1
      # GitHub issue 35: tests/test_ui_layout.py renders the page in headless Chromium on every push (it must run in CI)
      - name: Page test browser (Playwright, Chromium)
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install chromium
      - name: Unit tests (frames, card, settings, derived values, the page's layout; no meter, no Bluetooth)
        run: python -I -m unittest discover -s tests
      - name: Icons and third-party licences
        if: env.PACKAGE == 'true'
        run: |
          python -I packaging/make_icons.py build/icons
          python -I packaging/third_party.py build/THIRD_PARTY_LICENSES.txt
      - name: Application bundle
        if: env.PACKAGE == 'true'
        run: APP_VERSION="$VER" APP_ICON="$PWD/build/icons/121gw-companion.icns" pyinstaller --noconfirm packaging/companion.spec
      - name: A release is signed (the secrets must be there)
        if: github.ref_type == 'tag' && env.SIGN != 'true'
        run: |
          echo "a release tag needs the five signing secrets (MACOS_CERT_P12, MACOS_CERT_PASSWORD, NOTARY_KEY_P8, NOTARY_KEY_ID, NOTARY_ISSUER)"
          exit 1
      - name: Signing keychain (temporary, deleted at the end of the job)
        if: env.PACKAGE == 'true' && env.SIGN == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/sign.keychain-db"
          echo "SIGN_KC=$kc" >> "$GITHUB_ENV"           # first, so the cleanup step runs even if a later line fails
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT       # the private key never stays on the runner's disk
          kp=$(openssl rand -hex 24)
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # Apple's Developer ID G2 intermediate, checked against its SHA-256 (taken from apple.com/certificateauthority
          # on 2026-11-09)
          curl -sSf -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          fp=$(openssl x509 -inform der -in "$RUNNER_TEMP/DeveloperIDG2CA.cer" -noout -fingerprint -sha256 | cut -d= -f2)
          [ "$fp" = "F1:6C:D3:C5:4C:7F:83:CE:A4:BF:1A:3E:6A:08:19:C8:AA:A8:E4:A1:52:8F:D1:44:71:5F:35:06:43:D2:DF:3A" ] || { echo "unexpected G2 CA: $fp"; exit 1; }
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # the identity by its SHA-1 hash: exactly one Developer ID Application identity must be in the keychain
          n=$(security find-identity -v -p codesigning "$kc" | grep -c '"Developer ID Application' || true)
          [ "$n" = 1 ] || { echo "expected 1 Developer ID Application identity, found $n"; exit 1; }
          id=$(security find-identity -v -p codesigning "$kc" | awk '/"Developer ID Application/ {print $2; exit}')
          echo "SIGN_ID=$id" >> "$GITHUB_ENV"
      - name: Sign the application (Developer ID, hardened runtime)
        if: env.PACKAGE == 'true' && env.SIGN == 'true'
        run: sh packaging/sign_macos.sh "dist/121GW Companion.app" "$SIGN_ID" "$SIGN_KC"
      - name: The bundle answers (page, state, protections)
        if: env.PACKAGE == 'true'
        run: |
          set -euo pipefail
          "dist/121GW Companion.app/Contents/MacOS/121gw-companion" --no-open --port 8251 > app.log 2>&1 &
          pid=$!
          python -I .github/scripts/smoke.py http://127.0.0.1:8251 || { cat app.log; exit 1; }
          kill "$pid"
      - name: Disk image
        if: env.PACKAGE == 'true'
        run: SIGNED=$([ "$SIGN" = true ] && echo 1 || echo 0) sh packaging/make_dmg.sh "dist/121GW Companion.app" build/THIRD_PARTY_LICENSES.txt "121GW-Companion-$VER-macos-arm64.dmg"
      - name: Sign and notarize the disk image (stapled)
        if: env.PACKAGE == 'true' && env.SIGN == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          dmg="121GW-Companion-$VER-macos-arm64.dmg"
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          codesign --force --timestamp --sign "$SIGN_ID" --keychain "$SIGN_KC" "$dmg"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          NOTARY_KEY="$RUNNER_TEMP/notary.p8" sh packaging/notarize_macos.sh "$dmg"
      - name: Remove the signing keychain
        if: always() && env.SIGN == 'true'
        run: |
          security delete-keychain "$SIGN_KC" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
      - name: Checksum
        if: env.PACKAGE == 'true'
        run: python -I .github/scripts/sha256sum.py 121GW-Companion-*.dmg > "121GW-Companion-$VER-macos-arm64.dmg.sha256"
      - uses: actions/upload-artifact@v7
        if: env.PACKAGE == 'true'
        with:
          name: companion-macos
          path: 121GW-Companion-*
          if-no-files-found: error
      - name: Attach to the release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'companion-v')
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          python -I .github/scripts/release_notes.py .github/release-notes.md CHANGELOG.md "${tag#companion-v}" "https://github.com/${{ github.repository }}/blob/companion/CHANGELOG.md" "$RUNNER_TEMP/notes.md"   # only this version (issue 29)
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --latest=false \
            --title "121GW Companion ${tag#companion-}" --notes-file "$RUNNER_TEMP/notes.md" || gh release view "$tag" >/dev/null
          gh release upload "$tag" 121GW-Companion-* --clobber

  windows:
    name: Windows x64
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Version
        run: echo "VER=${REF_TAG#companion-v}" >> "$GITHUB_ENV"
      - name: Build tools and libraries
        run: python -m pip install $PIP_PKGS
      - name: Page test browser (cache)
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: ms-playwright-${{ runner.os }}-1.64.1
      # GitHub issue 35: tests/test_ui_layout.py renders the page in headless Chromium on every push (it must run in CI)
      - name: Page test browser (Playwright, Chromium)
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install chromium
      - name: Unit tests (frames, card, settings, derived values, the page's layout; no meter, no Bluetooth)
        run: python -I -m unittest discover -s tests
      - name: Icons and third-party licences
        if: env.PACKAGE == 'true'
        run: |
          python -I packaging/make_icons.py build/icons
          python -I packaging/third_party.py build/THIRD_PARTY_LICENSES.txt
      - name: Program folder
        if: env.PACKAGE == 'true'
        run: APP_VERSION="$VER" APP_ICON="$PWD/build/icons/121gw-companion.ico" pyinstaller --noconfirm packaging/companion.spec
      - name: Installer (Inno Setup)
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VER" "/DSourceDir=$PWD\dist\121gw-companion" "/DOutputDir=$PWD" `
            "/DLicenseFile=$PWD\LICENSE" "/DThirdParty=$PWD\build\THIRD_PARTY_LICENSES.txt" packaging\windows\121gw_companion.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installed program answers (page, state, protections)
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "121GW-Companion-*-windows-x64.exe" | Select-Object -First 1
          $dir = Join-Path $PWD "installed"
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir" -Wait
          $p = Start-Process -FilePath (Join-Path $dir "121gw-companion.exe") -ArgumentList "--no-open", "--port", "8251" -PassThru
          python -I .github/scripts/smoke.py http://127.0.0.1:8251 --timeout 180
          $ok = $LASTEXITCODE -eq 0
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { exit 1 }
      - name: Checksum
        if: env.PACKAGE == 'true'
        run: python -I .github/scripts/sha256sum.py 121GW-Companion-*-windows-x64.exe > "121GW-Companion-$VER-windows-x64.exe.sha256"
      - uses: actions/upload-artifact@v7
        if: env.PACKAGE == 'true'
        with:
          name: companion-windows
          path: 121GW-Companion-*
          if-no-files-found: error
      - name: Attach to the release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'companion-v')
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          python -I .github/scripts/release_notes.py .github/release-notes.md CHANGELOG.md "${tag#companion-v}" "https://github.com/${{ github.repository }}/blob/companion/CHANGELOG.md" "$RUNNER_TEMP/notes.md"   # only this version (issue 29)
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --latest=false \
            --title "121GW Companion ${tag#companion-}" --notes-file "$RUNNER_TEMP/notes.md" || gh release view "$tag" >/dev/null
          gh release upload "$tag" 121GW-Companion-* --clobber

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Version
        run: echo "VER=${REF_TAG#companion-v}" >> "$GITHUB_ENV"
      - name: Build tools and libraries
        run: python -m pip install $PIP_PKGS
      - name: Page test browser (cache)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.64.1
      # GitHub issue 35: tests/test_ui_layout.py renders the page in headless Chromium on every push (it must run in CI)
      - name: Page test browser (Playwright, Chromium)
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Unit tests (frames, card, settings, derived values, the page's layout; no meter, no Bluetooth)
        run: python -I -m unittest discover -s tests
      - name: Icons and third-party licences
        if: env.PACKAGE == 'true'
        run: |
          python -I packaging/make_icons.py build/icons
          python -I packaging/third_party.py build/THIRD_PARTY_LICENSES.txt
      - name: Program folder
        if: env.PACKAGE == 'true'
        run: APP_VERSION="$VER" pyinstaller --noconfirm packaging/companion.spec
      - name: AppImage
        if: env.PACKAGE == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage
          sh packaging/linux/build_appimage.sh dist/121gw-companion build/THIRD_PARTY_LICENSES.txt \
            "121GW-Companion-$VER-linux-x86_64.AppImage" build/icons/121gw-companion.png "$PWD/appimagetool.AppImage"
      - name: The AppImage answers (page, state, protections)
        if: env.PACKAGE == 'true'
        run: |
          set -euo pipefail
          ./"121GW-Companion-$VER-linux-x86_64.AppImage" --no-open --port 8251 > app.log 2>&1 &
          pid=$!
          python -I .github/scripts/smoke.py http://127.0.0.1:8251 || { cat app.log; exit 1; }
          kill "$pid"
      - name: Debian package, installed and started
        if: env.PACKAGE == 'true'
        run: |
          set -euo pipefail
          deb="121GW-Companion-$VER-linux-amd64.deb"
          sh packaging/linux/build_deb.sh dist/121gw-companion "$REF_TAG" build/THIRD_PARTY_LICENSES.txt "$deb" build/icons/121gw-companion.png
          sudo apt-get install -y "./$deb"
          121gw-companion --no-open --port 8252 > deb.log 2>&1 &
          pid=$!
          python -I .github/scripts/smoke.py http://127.0.0.1:8252 || { cat deb.log; exit 1; }
          kill "$pid"
          sudo apt-get remove -y 121gw-companion
      - name: Checksums
        if: env.PACKAGE == 'true'
        run: for f in 121GW-Companion-*.AppImage 121GW-Companion-*.deb; do python -I .github/scripts/sha256sum.py "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        if: env.PACKAGE == 'true'
        with:
          name: companion-linux
          path: 121GW-Companion-*
          if-no-files-found: error
      - name: Attach to the release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'companion-v')
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          python -I .github/scripts/release_notes.py .github/release-notes.md CHANGELOG.md "${tag#companion-v}" "https://github.com/${{ github.repository }}/blob/companion/CHANGELOG.md" "$RUNNER_TEMP/notes.md"   # only this version (issue 29)
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --latest=false \
            --title "121GW Companion ${tag#companion-}" --notes-file "$RUNNER_TEMP/notes.md" || gh release view "$tag" >/dev/null
          gh release upload "$tag" 121GW-Companion-* --clobber

  firmware-release:
    # The firmware workflow attaches "the newest companion" to each firmware release; a firmware tag pushed together
    # with a companion tag attached the previous companion (2026-11-07: v1.2.3 carried 1.2.25, not 1.2.26).  Once all
    # files of this companion release are there, they replace older companion files on the newest firmware release.
    name: Put this companion on the newest firmware release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'companion-v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Replace the companion files of the newest firmware release
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ver="${tag#companion-v}"
          fw=$(gh release list --limit 100 --exclude-drafts --json tagName,publishedAt \
               -q '[.[] | select(.tagName | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))] | sort_by(.publishedAt) | last | .tagName')
          test -n "$fw"
          have=$(gh release view "$fw" --json assets -q '[.assets[].name | select(startswith("121GW-Companion-"))
                 | capture("^121GW-Companion-(?<v>[0-9.]+)-").v] | unique | .[]')
          for v in $have; do                       # never put an older companion over a newer one
            if [ "$(printf '%s\n%s\n' "$v" "$ver" | sort -V | tail -1)" != "$ver" ]; then
              echo "$fw already carries companion $v, newer than $ver: nothing to do"; exit 0
            fi
          done
          mkdir companion
          gh release download "$tag" --dir companion --pattern "121GW-Companion-$ver-*"
          n=$(ls companion | wc -l)
          test "$n" -eq 8 || { echo "expected 8 files of $tag, found $n"; exit 1; }
          gh release upload "$fw" companion/* --clobber
          for a in $(gh release view "$fw" --json assets -q '.assets[].name | select(startswith("121GW-Companion-"))'); do
            case "$a" in "121GW-Companion-$ver-"*) ;; *) gh release delete-asset "$fw" "$a" -y; echo "removed $a" ;; esac
          done
          echo "$fw now carries companion $ver"

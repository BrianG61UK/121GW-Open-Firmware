# Firmware, branch like-v2.05: build the strict (like v2.05) variant with GNU binutils 2.46.0 (arm-none-eabi, built from
# the release tarball and cached, see .github/actions/arm-binutils), check that it equals firmware/STRICT_IMAGE.sha256,
# run the checks that need no original image, and on a tag like205-v* publish firmware-<tag>.zip.  The fast build and
# the emulator live on main.
name: Firmware (like v2.05)

on:
  push:
    branches: ['like-v2.05']
    tags: ['like205-v*']
  pull_request:
    branches: ['like-v2.05']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-like205-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and check the strict variant
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Strict build (make LOOP_V205=1) with `make check-ci`, image equal to STRICT_IMAGE.sha256
        uses: ./.github/actions/build-firmware
        with:
          target: check-ci
      - name: FIXES.md from firmware/ORIGINAL_FIRMWARE_ISSUES.md
        run: python3 -I firmware/tools/gen_fixes.py firmware/ORIGINAL_FIRMWARE_ISSUES.md dist/FIXES.md
      - name: Nothing from an original image or calibration may be published
        run: python3 -I .github/scripts/check_no_originals.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-like205-dist
          path: dist
          if-no-files-found: error

  release:
    name: Publish firmware-${{ github.ref_name }}.zip
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'like205-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag is like205-vA.B.C
        run: echo "$TAG" | grep -Eq '^like205-v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag $TAG is not like205-vA.B.C"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: firmware-like205-dist
          path: dist
      - name: Assemble firmware-<tag>.zip
        run: |
          set -euo pipefail
          mkdir stage
          cp -R dist/1_like_v2.05 stage/
          cp dist/FIXES.md LICENSE stage/
          (cd stage && sha256sum 1_like_v2.05/EEVBlog.bin FIXES.md LICENSE > SHA256SUMS)
          (cd stage && zip -r -X "../firmware-$TAG.zip" 1_like_v2.05 FIXES.md LICENSE SHA256SUMS)
          unzip -l "firmware-$TAG.zip"
          python3 -I .github/scripts/check_no_originals.py "firmware-$TAG.zip"
          python3 -I .github/scripts/sha256sum.py "firmware-$TAG.zip" > "firmware-$TAG.zip.sha256"
      - name: Create the release (not marked latest, so the fast release stays the default download) and attach the files
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --latest=false --title "121GW-Open-Firmware like v2.05 $TAG" \
              --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" "firmware-$TAG.zip" "firmware-$TAG.zip.sha256" --clobber

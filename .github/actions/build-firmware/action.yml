name: Build the like-v2.05 firmware
description: >
  Installs Python with Capstone and Unicorn and binutils 2.46.0, then runs firmware/tools/build_dist.sh: the strict
  build (make LOOP_V205=1) with the chosen make target, checked against firmware/STRICT_IMAGE.sha256 and collected in
  `dist/` (1_like_v2.05/EEVBlog.bin).
inputs:
  target:
    description: make target (check-ci = checks that need no original image; none = image only)
    default: check-ci
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install the check tools' Python modules
      shell: bash
      run: python -m pip install capstone==5.0.9 unicorn==2.1.4
    - uses: ./.github/actions/arm-binutils
    - name: Build and check
      shell: bash
      run: PYTHON=python sh firmware/tools/build_dist.sh dist "${{ inputs.target }}"

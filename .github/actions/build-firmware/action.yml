name: Build both firmware variants
description: >
  Installs Python with Capstone and Unicorn and binutils 2.46.0, then runs firmware/tools/build_dist.sh: production
  build (make) and strict build (make LOOP_V205=1), each with the chosen make target, collected in `dist/`
  (2_fast/EEVBlog.bin, 1_like_v2.05/EEVBlog.bin, v205_tables.json).
inputs:
  target:
    description: make target run for each variant (check-ci = checks that need no original image; none = image only)
    default: check-ci
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install the check tools' Python modules
      shell: bash
      run: python -m pip install capstone==5.0.9 unicorn==2.1.4
    - uses: ./.github/actions/arm-binutils
    - name: Build and check
      shell: bash
      run: PYTHON=python sh firmware/tools/build_dist.sh dist "${{ inputs.target }}"
